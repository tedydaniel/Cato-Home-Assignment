[project]
name = "cato-support-engineer-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.19.2",
    "email-validator>=2.3.0",
    "fastapi>=0.115,<1",
    "langchain>=1,<2",
    "langchain-openai>=0.3,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=2,<3",
    "langsmith>=0.3,<1",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.12,<1",
    "uvicorn[standard]>=0.32,<1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
