name: cato-support-engineer
services:
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
  backend:
    build: ./backend
    environment: &app_env
      POSTGRES_URL: ${POSTGRES_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-cato-support-engineer}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
    volumes: ["./data:/app/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      seed:
        condition: service_completed_successfully
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    environment: *app_env
    volumes: ["./data:/app/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      seed:
        condition: service_completed_successfully
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *app_env
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: ./backend
    command: ["python", "-m", "scripts.load_support_data"]
    environment: *app_env
    volumes: ["./data:/app/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cato_support}
      POSTGRES_USER: ${POSTGRES_USER:-cato_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./infra/postgres/init:/docker-entrypoint-initdb.d:ro"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
