name: cato-support-engineer
services:
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
  backend:
    build: ./backend
    environment: &app_env
      POSTGRES_URL: ${POSTGRES_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.020}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-cato-support-engineer}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes: ["./data:/app/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      seed:
        condition: service_completed_successfully
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *app_env
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: ./backend
    command: ["python", "-m", "scripts.load_support_data"]
    environment: *app_env
    volumes: ["./data:/app/data:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  ingest:
    build: ./backend
    command: ["python", "-m", "scripts.ingest_kb"]
    profiles: ["tools"]
    environment: *app_env
    volumes:
      - "./data:/app/data:ro"
      - "./knowledge_base:/app/knowledge_base"
    depends_on:
      seed: {condition: service_completed_successfully}
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cato_support}
      POSTGRES_USER: ${POSTGRES_USER:-cato_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./infra/postgres/init:/docker-entrypoint-initdb.d:ro"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
